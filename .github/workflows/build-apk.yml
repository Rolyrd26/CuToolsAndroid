
name: Construir APK de CuTools

on:
  workflow_dispatch:
  push:
    paths:
      - 'CuToolsAndroid_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip CuToolsAndroid_proyecto.zip -d proyecto
          find proyecto -name settings.gradle.kts -print

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")"
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "No se encontró la carpeta raíz del proyecto Android."
            find proyecto -maxdepth 4 -type f
            exit 1
          fi
          echo "Compilando desde: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CuTools-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
