
name: Construir APK de CuTools

on:
  workflow_dispatch:
  push:
    paths:
      - 'CuToolsAndroid_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip CuToolsAndroid_proyecto.zip -d proyecto

      - name: Corregir destino Java y Kotlin
        run: |
          python3 - <<'PY'
          import glob
          paths = glob.glob('proyecto/**/app/build.gradle.kts', recursive=True)
          if not paths:
              raise SystemExit("No se encontró app/build.gradle.kts")
          p = paths[0]
          with open(p, encoding='utf-8') as f:
              s = f.read()
          block = '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          if 'compileOptions' not in s:
              s = s.replace('android {', block, 1)
          with open(p, 'w', encoding='utf-8') as f:
              f.write(s)
          print("Configuración Java/Kotlin corregida:", p)
          PY

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(dirname "$(find proyecto -name settings.gradle.kts -print -quit)")"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CuTools-APK
          path: proyecto/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
