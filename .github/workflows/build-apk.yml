
name: Construir APK de CuTools

on:
  workflow_dispatch:
  push:
    paths:
      - 'CuToolsAndroid_proyecto.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip CuToolsAndroid_proyecto.zip -d proyecto
          find proyecto -name settings.gradle.kts -print

      - name: Compilar APK
        run: |
          cd proyecto
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: CuTools-APK
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
